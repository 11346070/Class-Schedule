<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}個人課表維護系統{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 導航列 -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="{% url 'index' %}">📚 個人課表維護系統</a>
            </div>
            <button class="nav-toggle" aria-label="切換導覽選單" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="{% url 'index' %}" {% if request.path == '/' %}class="active"{% endif %}>首頁</a></li>
                <li><a href="{% url 'course_list' %}" {% if 'courses' in request.path and 'my-courses' not in request.path %}class="active"{% endif %}>課程清單</a></li>
                <li><a href="{% url 'favorites' %}" {% if 'favorites' in request.path %}class="active"{% endif %}>收藏清單</a></li>
            </ul>
        </div>
    </nav>

    <!-- 訊息提示 -->
    {% if messages %}
    <div class="messages-container">
        <div class="container">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <!-- 主要內容 -->
    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 個人課表維護系統 | Django 期中專題</p>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
